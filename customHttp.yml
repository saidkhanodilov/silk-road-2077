customHeaders:
  # Security headers on every response. The site has no inline scripts or styles,
  # so the Content-Security-Policy can stay strict: everything loads from this origin.
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
  # Fonts never change, so browsers can keep them for a year.
  - pattern: '/assets/fonts/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
